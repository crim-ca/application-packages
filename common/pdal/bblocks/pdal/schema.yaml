$schema: https://json-schema.org/draft/2020-12/schema
description: OGC API - Processes process description of a pdal application package.
allOf:
- $ref: bblocks://ogc.api.processes.v1.schemas.process
- $ref: bblocks://ogc.api.processes.v2.schemas.staticIndicator
- type: object
  required:
  - id
  - version
  properties:
    id:
      enum:
      - pdal-chamfer
      - pdal-delta
      - pdal-density
      - pdal-eval
      - pdal-ground
      - pdal-hausdorff
      - pdal-info
      - pdal-merge
      - pdal-pipeline
      - pdal-random
      - pdal-sort
      - pdal-split
      - pdal-tile
      - pdal-tindex
      - pdal-translate
